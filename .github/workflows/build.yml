name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Verify jar contents
        run: |
          JAR=$(ls target/MetroRail-*.jar | head -n 1)
          echo "Built: $JAR"
          unzip -l "$JAR" | grep -E 'plugin.yml|config.yml|MetroRailPlugin.class' || {
            echo "::error::jar 缺少必要文件"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetroRail
          path: target/MetroRail-*.jar
          if-no-files-found: error
          retention-days: 30
